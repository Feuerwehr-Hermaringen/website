{{ define "main" }}
<div class="inhalt-breite">
  <article class="textseite">
    <h1>{{ .Title }}</h1>
    {{ .Content }}

    {{- with .Params.chronik }}
    <h2>Chronik</h2>
    <ol class="chronik">
      {{- range . }}
      <li class="chronik__eintrag">
        <span class="chronik__jahr">{{ .jahr }}</span>
        <span class="chronik__text">{{ .text }}</span>
      </li>
      {{- end }}
    </ol>
    {{- end }}
  </article>
</div>
{{ end }}
