<!doctype html>
<html lang="de">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  {{/* Skip-Link: erlaubt es, per Tastatur direkt zum Hauptinhalt zu springen (Barrierefreiheit). */}}
  <a class="skip-link" href="#hauptinhalt">Zum Hauptinhalt springen</a>

  {{- partial "header.html" . -}}

  <main id="hauptinhalt" tabindex="-1">
    {{- block "main" . }}{{ end -}}
  </main>

  {{- partial "footer.html" . -}}

  <script src="{{ "assets/main.js" | relURL }}" defer></script>
</body>
</html>
